name: Download center contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        postgres: [16, 18]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: synthetic-download-ci
        ports:
          - 5432:5432
        options: >-
          --label wqt.test=download-center-release
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild sqlite3
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix admin-web ci --include=dev
      - run: npm --prefix admin-web run build
      - run: npm --prefix enterprise-panel ci --include=dev
      - run: npm --prefix enterprise-panel run build
      - run: npm run test:downloads
        env:
          WQT_TEST_PG_ADMIN_URL: postgres://postgres:synthetic-download-ci@127.0.0.1:5432/postgres
          WQT_DOWNLOAD_PG_BROWSER: '1'
      - run: npm run test:downloads:browser
      - run: npm run test:downloads:release
        env:
          WQT_TEST_PG_ADMIN_URL: postgres://postgres:synthetic-download-ci@127.0.0.1:5432/postgres
          WQT_TEST_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
