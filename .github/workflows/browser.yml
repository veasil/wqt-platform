name: Browser contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build frontends with production deployment environment
        run: npm run build
        env:
          NODE_ENV: production
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium webkit
      - name: Card picker filters, cross-phase selection and mobile scrolling in Chromium and WebKit
        run: python tests/browser/verify-card-picker.py
      - name: Browser contracts with fake HTTP and no database
        run: python tests/browser/verify-ui.py
      - name: Platform delivery contracts with synthetic HTTP
        run: python tests/browser/verify-admin-delivery.py
      - name: SMS resend countdown across login, registration and password reset
        run: python tests/browser/verify-login-retry.py
      - name: Player boot recovery and entitled activity application
        run: python tests/browser/verify-player-availability.py
      - name: Cross-origin admin handoff and organization entitlement editing
        run: python tests/browser/verify-admin-access-rights.py
      - name: SMS provider and countdown contract tests
        run: node --test tests/sms-provider.test.mjs tests/frontend/sms-cooldown.test.mjs tests/frontend/captcha-loading.test.mjs
      - name: Aliyun captcha proof and SDK recovery across authentication pages
        run: python tests/browser/verify-aliyun-captcha.py
      - name: Fixed renewal and operation recovery rules
        run: node --test tests/admin-entitlements.test.mjs
