name: Browser contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix admin-web
      - run: npm --prefix admin-web run build
      - run: npm ci --prefix enterprise-panel
      - run: npm --prefix enterprise-panel run build
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser contracts with fake HTTP and no database
        run: python tests/browser/verify-ui.py
