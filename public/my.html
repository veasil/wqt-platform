<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 伍力全开</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .page-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
        }
        .nav-bar a:hover { opacity: 1; }
        .nav-bar h2 { color: white; font-size: 1.3rem; }

        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }

        .section { display: none; }
        .section.active { display: block; }

        h3 {
            color: #333;
            margin-bottom: 16px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea { resize: vertical; min-height: 100px; }

        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #5a6fd8; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .msg {
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }
        .msg.success { color: #28a745; }
        .msg.error { color: #dc3545; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; font-size: 13px; }
        .info-value { color: #333; font-size: 14px; font-weight: 500; }

        .session-item {
            padding: 14px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: box-shadow 0.2s;
        }
        .session-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .session-date { color: #888; font-size: 13px; }
        .session-score { font-weight: 600; color: #667eea; }
        .session-meta { color: #999; font-size: 12px; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .file-item a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }
        .file-item a:hover { text-decoration: underline; }
        .file-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #666;
        }
        .file-type.audio { background: #e8f5e9; color: #2e7d32; }
        .file-type.report { background: #e3f2fd; color: #1565c0; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }

        .loading { text-align: center; color: #999; padding: 20px; }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="nav-bar">
            <a id="home-link" href="/">&larr; 返回首页</a>
            <h2>个人中心</h2>
            <a href="/downloads.html" style="display:inline-flex;align-items:center;gap:6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>下载中心</a>
            <a href="#" id="logout-btn">退出登录</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="profile">个人信息</button>
            <button class="tab-btn" data-tab="activities">活动记录</button>
            <button class="tab-btn" data-tab="feedback">反馈</button>
        </div>

        <!-- 个人信息 -->
        <div class="section active" id="sec-profile">
            <div class="card">
                <h3>基本信息</h3>
                <div id="profile-info">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="card">
                <h3>修改信息</h3>
                <form id="edit-profile-form">
                    <div class="form-group">
                        <label>真实姓名</label>
                        <input type="text" id="edit-realname" maxlength="20" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-group">
                        <label>守望师名</label>
                        <input type="text" id="edit-guardian" maxlength="20" placeholder="游戏中显示的昵称">
                    </div>
                    <button type="submit" class="btn">保存修改</button>
                    <div class="msg" id="profile-msg"></div>
                </form>
            </div>
            <div class="card">
                <h3>修改密码</h3>
                <form id="password-form">
                    <div class="form-group" id="old-pw-group">
                        <label>旧密码 <span style="color:#999;font-weight:normal;">(首次设置可留空)</span></label>
                        <input type="password" id="old-password" placeholder="当前密码">
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="new-password" placeholder="至少6位" minlength="6">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirm-new-password" placeholder="再次输入新密码">
                    </div>
                    <button type="submit" class="btn">更新密码</button>
                    <div class="msg" id="password-msg"></div>
                </form>
            </div>
        </div>

        <!-- 活动记录 -->
        <div class="section" id="sec-activities">
            <div class="card">
                <h3>游戏场次</h3>
                <div id="sessions-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="card">
                <h3>我的文件</h3>
                <div id="files-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 反馈 -->
        <div class="section" id="sec-feedback">
            <div class="card">
                <h3>提交反馈</h3>
                <form id="feedback-form">
                    <div class="form-group">
                        <label>反馈类型</label>
                        <select id="feedback-type">
                            <option value="suggestion">建议</option>
                            <option value="bug">Bug 报告</option>
                            <option value="reflection">游戏感想</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="feedback-content" placeholder="请输入您的反馈内容..." required></textarea>
                    </div>
                    <button type="submit" class="btn">提交反馈</button>
                    <div class="msg" id="feedback-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ===== Base path (staging support) =====
        const HOME_URL = localStorage.getItem('wqt_home_url') || (window.location.pathname.startsWith('/staging/') ? '/staging/' : '/');
        const API_BASE = localStorage.getItem('wqt_api_base') || (window.location.pathname.startsWith('/staging/') ? '/staging/api' : '/api');

        // ===== Auth =====
        const token = localStorage.getItem('WQT_AUTH_TOKEN');
        if (!token) { window.location.href = HOME_URL; }

        // Set home link dynamically
        document.getElementById('home-link').href = HOME_URL;

        async function api(path, options = {}) {
            const url = path.startsWith('api/') ? API_BASE + path.slice(3) : HOME_URL + path;
            const response = await fetch(url, {
                method: options.method || 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: options.body ? JSON.stringify(options.body) : null
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + type;
            if (type === 'success') setTimeout(() => { el.textContent = ''; }, 3000);
        }

        function formatTime(ms) {
            if (!ms) return '-';
            const d = new Date(typeof ms === 'string' ? ms : Number(ms));
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        // ===== Tabs =====
        const tabBtns = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.section');
        tabBtns.forEach(btn => {
            btn.onclick = () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
            };
        });

        // ===== Profile =====
        async function loadProfile() {
            try {
                const { user } = await api('api/me');
                document.getElementById('profile-info').innerHTML = `
                    <div class="info-row"><span class="info-label">手机号</span><span class="info-value">${user.phone || '-'}</span></div>
                    <div class="info-row"><span class="info-label">真实姓名</span><span class="info-value">${user.realName || '未设置'}</span></div>
                    <div class="info-row"><span class="info-label">守望师名</span><span class="info-value">${user.guardianName || '未设置'}</span></div>
                    <div class="info-row"><span class="info-label">角色</span><span class="info-value">${user.role}</span></div>
                    <div class="info-row"><span class="info-label">组织</span><span class="info-value">${user.enterpriseId ? '已绑定 (ID:' + user.enterpriseId + ')' : '无'}</span></div>
                `;
                document.getElementById('edit-realname').value = user.realName || '';
                document.getElementById('edit-guardian').value = user.guardianName || '';
            } catch (e) {
                document.getElementById('profile-info').innerHTML = `<div class="msg error">${e.message}</div>`;
            }
        }

        document.getElementById('edit-profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('profile-msg');
            const guardianName = document.getElementById('edit-guardian').value.trim();
            const realName = document.getElementById('edit-realname').value.trim();
            if (!guardianName && !realName) { showMsg(msgEl, '请至少填写一项', 'error'); return; }
            try {
                const body = {};
                if (guardianName) body.guardianName = guardianName;
                if (realName) body.realName = realName;
                await api('api/me/profile', { method: 'PUT', body });
                showMsg(msgEl, '保存成功', 'success');
                loadProfile();
            } catch (err) {
                showMsg(msgEl, err.message, 'error');
            }
        };

        document.getElementById('password-form').onsubmit = async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('password-msg');
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-new-password').value;
            if (newPassword.length < 6) { showMsg(msgEl, '新密码至少6位', 'error'); return; }
            if (newPassword !== confirm) { showMsg(msgEl, '两次密码不一致', 'error'); return; }
            try {
                const body = { newPassword };
                if (oldPassword) body.oldPassword = oldPassword;
                await api('api/me/password', { method: 'PUT', body });
                showMsg(msgEl, '密码更新成功', 'success');
                document.getElementById('password-form').reset();
            } catch (err) {
                showMsg(msgEl, err.message, 'error');
            }
        };

        // ===== Sessions =====
        async function loadSessions() {
            const el = document.getElementById('sessions-list');
            try {
                const { sessions } = await api('api/me/sessions');
                if (!sessions || sessions.length === 0) {
                    el.innerHTML = '<div class="empty-state">暂无游戏记录</div>';
                    return;
                }
                el.innerHTML = sessions.map(s => {
                    const statusMap = { active: '进行中', auto_finished: '已自动结算', flagged: '已标记' };
                    const statusText = statusMap[s.status] || '已完成';
                    const scoreText = s.final_score != null ? s.final_score + ' 分' : (s.status === 'active' ? '进行中' : '未评分');
                    return `
                    <div class="session-item">
                        <div class="session-header">
                            <span class="session-date">${formatTime(s.started_at)}</span>
                            <span class="session-score">${scoreText}</span>
                        </div>
                        <div class="session-meta">
                            模式: ${s.game_mode || '标准'} | ${statusText}
                            ${s.ended_at ? ' | 时长: ' + Math.round((s.ended_at - s.started_at) / 60000) + '分钟' : ''}
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (e) {
                el.innerHTML = `<div class="msg error">${e.message}</div>`;
            }
        }

        // ===== Files =====
        async function loadFiles() {
            const el = document.getElementById('files-list');
            try {
                const { files } = await api('api/me/files');
                if (!files || files.length === 0) {
                    el.innerHTML = '<div class="empty-state">暂无文件</div>';
                    return;
                }
                el.innerHTML = files.map(f => {
                    const typeLabel = f.type === 'audio' ? '录音' : '报告';
                    const typeClass = f.type === 'audio' ? 'audio' : 'report';
                    return `
                        <div class="file-item">
                            <div>
                                <span class="file-type ${typeClass}">${typeLabel}</span>
                                <span style="margin-left:8px;font-size:13px;color:#555;">${formatTime(f.lastModified)}</span>
                            </div>
                            <a href="${f.url}" target="_blank">查看</a>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                el.innerHTML = `<div class="msg error">${e.message}</div>`;
            }
        }

        // ===== Feedback =====
        document.getElementById('feedback-form').onsubmit = async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('feedback-msg');
            const type = document.getElementById('feedback-type').value;
            const content = document.getElementById('feedback-content').value.trim();
            if (!content) { showMsg(msgEl, '请输入内容', 'error'); return; }
            try {
                await api('api/me/feedback', { method: 'POST', body: { type, content } });
                showMsg(msgEl, '反馈已提交，感谢！', 'success');
                document.getElementById('feedback-content').value = '';
            } catch (err) {
                showMsg(msgEl, err.message, 'error');
            }
        };

        // ===== Logout =====
        document.getElementById('logout-btn').onclick = (e) => {
            e.preventDefault();
            localStorage.removeItem('WQT_AUTH_TOKEN');
            localStorage.removeItem('WQT_USER_CACHE');
            window.location.href = HOME_URL;
        };

        // ===== Init =====
        loadProfile();
        loadSessions();
        loadFiles();
    </script>
</body>

</html>
