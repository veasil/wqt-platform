<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 伍力全开</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .code-row {
            display: flex;
            gap: 10px;
        }

        .code-row input {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-code {
            white-space: nowrap;
            width: auto;
            margin-top: 0;
            padding: 12px 14px;
            font-size: 14px;
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-code:hover {
            background: #f0f3ff;
        }

        .btn-code:disabled {
            background: #f5f5f5;
            color: #aaa;
            border-color: #e1e5e9;
            cursor: not-allowed;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .success {
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .hint a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .hint a:hover {
            text-decoration: underline;
        }

        .field-hint {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🔑</div>
        <h1>找回密码</h1>
        <p class="subtitle">请输入已注册的手机号，验证后设置新密码</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="phone">手机号 *</label>
                <input type="tel" id="phone" placeholder="请输入已注册的手机号" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="code">短信验证码 *</label>
                <div class="code-row">
                    <input type="text" id="code" inputmode="numeric" placeholder="6位验证码" maxlength="6" required
                        autocomplete="one-time-code">
                    <button type="button" class="btn-code" id="send-code-btn">获取验证码</button>
                </div>
            </div>

            <div class="form-group">
                <label for="password">新密码 *</label>
                <input type="password" id="password" placeholder="至少6位" minlength="6" required>
                <div class="field-hint">密码至少需要6位字符</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认新密码 *</label>
                <input type="password" id="confirm-password" placeholder="再次输入新密码" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">重置密码</button>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>
        </form>

        <p class="hint">
            想起来了？<a href="/">返回登录</a>
            &nbsp;|&nbsp;
            还没有账号？<a href="/register.html">注册新账号</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const sendCodeBtn = document.getElementById('send-code-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        let countdownTimer = null;

        function startCountdown(seconds) {
            let remaining = seconds;
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = `${remaining}秒后重试`;
            countdownTimer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '获取验证码';
                } else {
                    sendCodeBtn.textContent = `${remaining}秒后重试`;
                }
            }, 1000);
        }

        // 发送验证码
        sendCodeBtn.addEventListener('click', async () => {
            errorMessage.textContent = '';
            successMessage.textContent = '';
            const phone = document.getElementById('phone').value.trim();
            if (!phone) { errorMessage.textContent = '请先输入手机号'; return; }

            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '发送中...';
            try {
                const response = await fetch('/api/auth/sms/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '验证码发送失败');

                successMessage.textContent = '验证码已发送，请查收短信';
                if (data.mockCode) {
                    successMessage.textContent = `开发环境验证码：${data.mockCode}`;
                }
                startCountdown(60);
            } catch (err) {
                errorMessage.textContent = err.message;
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '获取验证码';
            }
        });

        // 提交重置
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.textContent = '';
            successMessage.textContent = '';

            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!phone) { errorMessage.textContent = '请输入手机号'; return; }
            if (!code) { errorMessage.textContent = '请输入验证码'; return; }
            if (password.length < 6) { errorMessage.textContent = '新密码至少需要6位'; return; }
            if (password !== confirmPassword) { errorMessage.textContent = '两次密码输入不一致'; return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '重置失败');

                successMessage.textContent = '密码重置成功！正在跳转登录...';
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } catch (err) {
                errorMessage.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
            }
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                errorMessage.textContent = '';
            });
        });
    </script>
</body>

</html>
