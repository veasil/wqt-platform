<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 伍力全开</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .hint a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .hint a:hover {
            text-decoration: underline;
        }

        .field-hint {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        .invite-code-input {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>注册伍力全开</h1>
        <p class="subtitle">请填写以下信息完成注册</p>

        <form id="register-form">
            <div class="form-group" id="existing-user-option" style="display:none"><label><input type="checkbox" id="existing-user" style="width:auto"> 我已注册，用邀请码加入另一个组织</label><div class="field-hint">选择密码或短信验证，保留原用户资料。</div></div>
            <div class="form-group" id="verification-method-row" style="display:none"><label for="verification-method">身份验证方式</label><select id="verification-method"><option value="password">密码验证</option><option value="sms">短信验证（先完成人机验证）</option><option disabled>微信 · 待接入</option></select></div>
            <div class="form-group">
                <label for="invite-code">邀请码 *</label>
                <input type="text" id="invite-code" class="invite-code-input"
                    placeholder="请输入邀请码" maxlength="20" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="phone">手机号 *</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="real-name">真实姓名 *</label>
                <input type="text" id="real-name" placeholder="请输入真实姓名" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="sms-code">短信验证码 *</label>
                <input id="sms-code" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入短信验证码" required>
                <button type="button" id="send-sms" class="btn" style="margin-top:10px">获取验证码</button>
                <div id="sms-status" class="field-hint" role="status"></div>
            </div>

            <div class="form-group">
                <label for="nickname">守望师名 *</label>
                <input type="text" id="nickname" placeholder="游戏中显示的昵称" maxlength="20" required>
                <div class="field-hint">将用于游戏记录和复盘报告</div>
            </div>

            <div class="form-group">
                <label for="password">密码 *</label>
                <input type="password" id="password" placeholder="至少6位" minlength="6" required>
                <div class="field-hint">新手机号设置密码；已有手机号请输入原密码，原身份资料会保留</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认密码 *</label>
                <input type="password" id="confirm-password" placeholder="再次输入密码" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">注册</button>
            <div id="error-message" class="error"></div>
        </form>

        <p class="hint">
            已有账号？<a href="/">返回登录</a>
        </p>
    </div>

    <script src="/identity-verification.js"></script>
    <script>
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');
        const sendSms = document.getElementById('send-sms');
        const invitedCode = new URLSearchParams(window.location.search).get('inviteCode');
        if (invitedCode) document.getElementById('invite-code').value = invitedCode.toUpperCase();
        let pendingRegistration = null;
        fetch('/api/settings').then(r=>r.json()).then(data=>{
            if(data.accountModel==='accounts') document.getElementById('existing-user-option').style.display='';
        }).catch(()=>{});
        function updateVerification() {
            const existing=document.getElementById('existing-user').checked;
            const method=document.getElementById('verification-method').value;
            document.getElementById('verification-method-row').style.display=existing ? '' : 'none';
            for(const [id,required] of [['password',!existing || method==='password'],['sms-code',!existing || method==='sms']]) {const field=document.getElementById(id);field.required=required;field.closest('.form-group').style.display=required ? '' : 'none';}
        }
        document.getElementById('verification-method').onchange=updateVerification;
        document.getElementById('existing-user').onchange = e => {
            for (const id of ['real-name','nickname','confirm-password']) {
                const input = document.getElementById(id);
                input.required = !e.target.checked;
                input.closest('.form-group').style.display = e.target.checked ? 'none' : '';
            }
            updateVerification();
            submitBtn.textContent = e.target.checked ? '验证并加入组织' : '注册';
        };
        sendSms.onclick = async () => {
            const phone = document.getElementById('phone').value.trim();
            const status = document.getElementById('sms-status');
            if (!phone) { status.textContent = '请先填写手机号'; return; }
            sendSms.disabled = true;
            try {
                const response = await fetch('/api/auth/sms/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, ...await window.WqtVerification.captchaProof() }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '发送失败');
                status.textContent = data.mockCode ? `测试验证码：${data.mockCode}` : '验证码已发送';
                setTimeout(() => { sendSms.disabled = false; }, 60000);
            } catch (error) { status.textContent = error.message; sendSms.disabled = false; }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.textContent = '';

            const code = document.getElementById('invite-code').value.trim().toUpperCase();
            const phone = document.getElementById('phone').value.trim();
            const realName = document.getElementById('real-name').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const smsCode = document.getElementById('sms-code').value.trim();
            const existingUser = document.getElementById('existing-user').checked;

            if (!code) { errorMessage.textContent = '请输入邀请码'; return; }
            if (!phone) { errorMessage.textContent = '请输入手机号'; return; }
            const verificationMethod=existingUser ? document.getElementById('verification-method').value : undefined;
            if ((!existingUser || verificationMethod==='sms') && !smsCode) { errorMessage.textContent = '请输入短信验证码'; return; }
            if (!existingUser && !realName) { errorMessage.textContent = '请输入真实姓名'; return; }
            if (!existingUser && !nickname) { errorMessage.textContent = '请输入守望师名'; return; }
            if ((!existingUser || verificationMethod==='password') && password.length < 6) { errorMessage.textContent = '密码至少需要6位'; return; }
            if (!existingUser && password !== confirmPassword) { errorMessage.textContent = '两次密码输入不一致'; return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '注册中...';

            try {
                const fingerprint = JSON.stringify({ code, phone, realName, nickname, password });
                if (!pendingRegistration || pendingRegistration.fingerprint !== fingerprint) pendingRegistration = { fingerprint, requestId: crypto.randomUUID() };
                const response = await fetch('/api/auth/register-with-invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, phone, realName, nickname, password:verificationMethod==='sms' ? undefined:password, smsCode:verificationMethod==='password' ? undefined:smsCode, verificationMethod, requestId: pendingRegistration.requestId })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || '注册失败');
                }

                // 保存登录状态，回到首页时自动登录
                localStorage.setItem('WQT_AUTH_TOKEN', data.token);
                if (data.user) {
                    localStorage.setItem('WQT_USER_CACHE', JSON.stringify(data.user));
                }
                sessionStorage.setItem('skip_intro', 'true');

                submitBtn.textContent = '注册成功！正在跳转...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (err) {
                errorMessage.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '注册';
            }
        });

        // 清除错误提示
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => { errorMessage.textContent = ''; });
        });
    </script>
</body>

</html>
