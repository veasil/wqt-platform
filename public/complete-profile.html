<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完善资料 - 伍力全开</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .field-hint {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>欢迎加入伍力全开！</h1>
        <p class="subtitle">请完善您的个人信息，即可开始游戏</p>

        <form id="profile-form">
            <div class="form-group">
                <label for="real-name">真实姓名 *</label>
                <input type="text" id="real-name" placeholder="请输入真实姓名" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="guardian-name">守望师名 *</label>
                <input type="text" id="guardian-name" placeholder="游戏中显示的昵称" maxlength="20" required>
                <div class="field-hint">将用于游戏记录和复盘报告</div>
            </div>

            <div class="form-group">
                <label for="password">设置密码 *</label>
                <input type="password" id="password" placeholder="至少6位" minlength="6" required>
                <div class="field-hint">设置密码后可用手机号+密码直接登录</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认密码 *</label>
                <input type="password" id="confirm-password" placeholder="再次输入密码" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                完成设置，开始游戏
            </button>

            <div id="error-message" class="error"></div>
        </form>

        <p class="hint">
            信息仅用于游戏体验，不会对外公开
        </p>
    </div>

    <script>
        const form = document.getElementById('profile-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        // 检查登录状态
        const token = localStorage.getItem('WQT_AUTH_TOKEN');
        if (!token) {
            alert('请先登录');
            window.location.href = '/';
        }

        async function api(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };

            const response = await fetch(path, {
                method: options.method || 'GET',
                headers,
                body: options.body ? JSON.stringify(options.body) : null
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({ error: '请求失败' }));
                throw new Error(error.error || `HTTP ${response.status}`);
            }

            return await response.json();
        }

        const identityMode = JSON.parse(localStorage.getItem('WQT_USER_CACHE') || '{}').identityId != null;
        if (identityMode) {
            for (const id of ['password', 'confirm-password']) {
                const input = document.getElementById(id);
                input.required = false;
                input.closest('.form-group').style.display = 'none';
            }
        }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.textContent = '';

            const realName = document.getElementById('real-name').value.trim();
            const guardianName = document.getElementById('guardian-name').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!realName) { errorMessage.textContent = '请输入真实姓名'; return; }
            if (!guardianName) { errorMessage.textContent = '请输入守望师名'; return; }
            if (guardianName.length > 20) { errorMessage.textContent = '守望师名不超过20个字符'; return; }
            if (!identityMode && password.length < 6) { errorMessage.textContent = '密码至少需要6位'; return; }
            if (!identityMode && password !== confirmPassword) { errorMessage.textContent = '两次密码输入不一致'; return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '设置中...';

            try {
                const result = await api('api/auth/complete-profile', {
                    method: 'POST',
                    body: { guardianName, realName, ...(!identityMode ? { password } : {}) }
                });

                localStorage.setItem('WQT_USER_INFO', JSON.stringify(result.user));

                submitBtn.textContent = '设置成功！';
                sessionStorage.setItem('skip_intro', 'true');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);

            } catch (error) {
                errorMessage.textContent = error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '完成设置，开始游戏';
            }
        });

        // 清除错误提示
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => { errorMessage.textContent = ''; });
        });

        // 自动聚焦
        document.getElementById('real-name').focus();
    </script>
</body>

</html>
