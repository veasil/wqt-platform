<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>一起做个好选择 · Emma 课件示例</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><a class="brand" href="/">伍仟天 <span>课堂实验室</span></a><div><span id="connection">尚未连接</span><button id="login" class="small">连接伍仟天</button><button id="logout" class="small secondary" hidden>退出课件</button></div></header><main><section class="intro"><p class="eyebrow">EMMA · 独立课件示例</p><h1>一起做个<br><em>好选择。</em></h1><p class="lead">把生活里的小问题带进课堂。讨论、选择，看看我们的伍力如何变化。</p><div class="lesson"><span>今天的讨论</span><h2>当屏幕吸引了我们所有的注意力，<br>还有什么值得看见？</h2><p>说说你的想法，再用这一局的卡牌尝试不同选择。</p></div></section><section class="workspace" aria-label="课堂计分"><div class="section-head"><h2>本次课堂</h2><span id="phase">准备开始</span></div><p id="message" role="status" aria-live="polite">连接你的伍仟天账号，开始一次课堂演示。</p><form id="start-form"><label>已发布卡组编号<input name="cardGroupId" type="number" min="1" required value="1"></label><label>课堂地点<input name="location" maxlength="200" required value="Emma 示范课堂"></label><button id="start" type="submit" disabled>开始课堂</button></form><div id="game" hidden><div id="scores" class="scores"></div><div class="actions"><button id="refresh" class="secondary">恢复最新状态</button><button id="pause" class="secondary">暂停</button><button id="advance" class="secondary" hidden>进入下一阶段</button></div><div id="cards"></div><details><summary>老师调整伍力</summary><form id="adjust-form"><div id="adjust-fields" class="adjust-fields"></div><label>调整理由<input name="reason" maxlength="200" value="课堂讨论后的共同观察"></label><button type="submit" class="secondary">保存伍力</button></form></details><button id="finish" class="finish">结束课堂，查看结果</button></div><div id="result" hidden></div><button id="retry" class="secondary" hidden>重试上一项未确认的操作</button></section></main><footer>这是可替换的课件示例。课堂交互独立运行，场次与分数保存于伍仟天。</footer></body></html>
