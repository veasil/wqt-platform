  function btn(text,action,cls='',disabled=false,id=''){return `<button data-od-id="${id||action}" class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`}
  function dev(){return `<button class="dev-entry" data-od-id="developer-notes-entry" data-action="dev">开发说明 · 状态地图</button>${S.dev?`<aside class="doc-drawer" data-od-id="developer-notes"><div class="modal-head"><div><span class="kicker">IMPLEMENTATION CONTRACT</span><h2>开发说明 / 状态地图</h2></div><button class="icon-btn" data-action="dev">×</button></div><h3>核心组件</h3><div class="state-map"><div class="state-item">AppShell：顶部模式导航、用户状态、网络同步</div><div class="state-item">SetupFlow：活动码验证、授权活动选择、阶段卡配置</div><div class="state-item">GameRail：本局状态 / 伍力技能 / 现场督导互斥浮层</div><div class="state-item">CardReader：编号校验、快速选卡、选项、反馈、属性变化、音频</div></div><h3>状态转换</h3><p class="hint">登录 → 活动码校验 → 活动选择 → 配置 → 游戏空态 → 快速选卡 → 已读取 → 已选择 → 反馈 → 听反馈 → 下一张。暂停锁定读卡；停止需二次确认。</p><h3>校验与禁用</h3><p class="hint">手机号 11 位；密码至少 6 位；验证码 6 位；协议与安全验证完成后才允许登录。活动码固定 5 位大写字母。配置数量必须匹配模式总数。</p><h3>真实集成边界</h3><p class="hint">当前全部为客户端假数据。登录验证码区明确待接阿里云验证码服务；活动授权、读卡记录、计时同步、录音上传和反馈音频均需后端契约。网络错状态不得自动判定业务失败，恢复后应重试幂等请求。</p></aside>`:''}`}
  function login(){const valid=/^1\d{10}$/.test(S.phone)&&(S.loginMode==='password'?S.secret.length>=6:/^\d{6}$/.test(S.secret))&&S.agreed&&S.verified;return `<main class="screen setup-page" data-od-id="login-screen"><section class="shell auth-shell" data-od-id="login-panel"><div class="auth-art"><span class="kicker">WATCHER ACCESS</span><h1>回到你的<br>守望者席位</h1><p>登录后可继续桌游计分、现场监督与成长复盘。</p><img class="xw" src="assets/xiao-wu.png" alt="伍力全开小伍 IP"></div><div class="auth-form"><div class="brand-line"><img src="assets/logo.png" alt="伍力全开官方 Logo"><span class="kicker">桌游计分系统</span></div><h2 data-od-id="login-title">守望者登录</h2><p class="hint">使用已授权手机号进入</p><div class="tabs"><button class="tab ${S.loginMode==='password'?'active':''}" data-action="login-password">密码登录</button><button class="tab ${S.loginMode==='code'?'active':''}" data-action="login-code">验证码登录</button></div><div class="form-row"><label class="label">手机号</label><input class="field" data-field="phone" value="${esc(S.phone)}" placeholder="请输入 11 位手机号"><div class="error ${S.phone&&!/^1\d{10}$/.test(S.phone)?'':'hidden'}">请输入有效的中国大陆手机号</div></div><div class="form-row"><label class="label">${S.loginMode==='password'?'登录密码':'短信验证码'}</label><input class="field" data-field="secret" type="${S.loginMode==='password'?'password':'text'}" value="${esc(S.secret)}" placeholder="${S.loginMode==='password'?'至少 6 位字符':'请输入 6 位验证码'}"></div><div class="verify"><span>◇ <strong>${S.verified?'安全验证已完成':'点击完成安全验证'}</strong><small>待接阿里云验证码服务</small></span><button class="btn ghost" data-action="verify">${S.verified?'已验证':'验证'}</button></div><label class="check-row"><input type="checkbox" data-action="agree" ${S.agreed?'checked':''}><span>我已阅读并同意 <u>隐私说明</u> 与 <u>使用条款</u></span></label>${btn(S.loading?'正在登录…':'进入计分系统','login','primary',!valid||S.loading,'login-submit')}<p class="error ${S.network?'':'hidden'}">网络连接失败，请检查网络后重试</p></div></section></main>${dev()}`}
  function activity(){const canNext=S.activity!==null;return `<main class="screen setup-page" data-od-id="activity-screen"><section class="shell relative"><header class="shell-head"><div><h1 data-od-id="activity-title">选择当前活动</h1><p class="hint">输入活动码并选择已授权、当前开放的活动。</p></div><div class="step">步骤 <strong>1</strong> / 2</div></header><div class="shell-body"><div class="code-block"><div><label class="label">五位活动码</label><input class="field code-input" data-field="activityCode" maxlength="5" value="${esc(S.activityCode)}" placeholder="例如 WQTAY"><div class="${S.codeState==='error'?'error':'hint'}">${S.codeState==='error'?'活动码无效或不在开放时间内':S.codeState==='ok'?'验证成功，已加载授权活动':'仅接受 5 位英文字母，不区分大小写'}</div></div>${btn(S.codeState==='loading'?'校验中…':'校验并加载','validate-code','',!/^[A-Za-z]{5}$/.test(S.activityCode)||S.codeState==='loading','validate-activity-code')}</div><h2 class="subhead">授权活动</h2>${S.codeState==='idle'?`<div class="summary hint" data-od-id="activity-empty-state">校验活动码后显示可选活动</div>`:''}${S.codeState==='loading'?`<div class="summary hint">正在连接活动授权服务…</div>`:''}${S.activities.length?`<div class="activity-list">${S.activities.map((a,i)=>`<button class="activity ${S.activity===i?'selected':''}" data-action="pick-activity" data-value="${i}" data-od-id="activity-card-${i}"><span class="pin">⌖</span><span class="activity-main"><strong>${a.name}</strong><span class="hint">${a.place}</span></span><span class="chip green">● 当前开放</span><span>›</span></button>`).join('')}</div>`:''}</div><footer class="action-bar">${btn('返回登录','back-login','ghost',false,'activity-back')}${btn('下一步 →','activity-next','primary',!canNext,'activity-next')}</footer></section></main>${dev()}`}
  function config(){const modes={standard:['标准成长模式','5000 秒',15,[5,5,5]],quick:['快速成长模式','3600 秒',9,[3,3,3]],custom:['自定义模式','活动预设 4200 秒',null,[4,2,3]]};const m=modes[S.mode],sum=S.counts.reduce((a,b)=>a+b,0),valid=m[2]?sum===m[2]:sum>=1&&S.counts.every((x,i)=>x<=[12,10,8][i]);return `<main class="screen setup-page" data-od-id="config-screen"><section class="shell relative"><header class="shell-head"><div><h1 data-od-id="config-title">配置阶段卡牌</h1><p class="hint">根据活动与模式分配三个阶段的卡牌数量。</p></div><div class="step">步骤 <strong>2</strong> / 2</div></header><div class="shell-body"><div class="summary"><span class="hint">当前活动</span><br><strong>未来守望者 · 城市站</strong><div class="hint">上海 · 城市站</div></div><div class="mode-switch" data-od-id="mode-switch">${Object.entries(modes).map(([k,v])=>`<button class="mode ${S.mode===k?'active':''}" data-action="mode" data-value="${k}"><strong>${v[0]}</strong><br><span class="hint">${v[1]}${v[2]?' · 共 '+v[2]+' 张':''}</span></button>`).join('')}</div><div class="config-grid">${['启蒙期','成长期','青春期'].map((n,i)=>`<div class="stepper" data-od-id="stage-stepper-${i}"><strong>${n}</strong><div class="stepper-row"><button data-action="step" data-value="${i},-1" aria-label="减少${n}">−</button><output>${S.counts[i]}</output><button data-action="step" data-value="${i},1" aria-label="增加${n}">＋</button></div>${S.mode==='custom'?`<div class="hint" style="text-align:center">最多 ${[12,10,8][i]} 张</div>`:''}</div>`).join('')}</div><div class="allocation" style="${valid?'':'border-color:var(--red);color:oklch(79% .14 20)'}">${valid?'✓':'!'} 已分配 ${sum}${m[2]?' / '+m[2]:''} 张 · ${valid?'符合开始条件':'数量不符合当前模式要求'}</div></div><footer class="action-bar">${btn('上一步','config-back','ghost')}${btn('开始游戏 →','start-game','primary',!valid,'start-game')}</footer></section></main>${dev()}`}
  function header(){return `<header class="topbar" data-od-id="product-header"><div class="brand"><img src="assets/logo.png" alt="伍力全开官方 Logo"><div><strong>AI@5000days</strong><small>《伍力全开》桌游计分系统</small></div></div><nav class="topnav"><button class="nav-tab active" data-action="top-game"><small>PLAY</small>桌游模式</button><button class="nav-tab" data-action="top-watch"><small>WATCH</small>监督模式</button><button class="nav-tab" data-action="top-me"><small>ME</small>我的</button></nav><div class="userbox"><div class="timer"><span class="hint">本局剩余</span><br><b>${S.paused?'PAUSED':'83:20'}</b></div><span class="avatar">A</span><div><strong>Arden</strong><small class="hint">内部测试员</small></div></div></header>`}
  function side(){let body='';if(S.panel==='status')body=`<h3>本局游戏状态</h3><div class="metric-row"><span>活动</span><b>未来守望者·城市站</b></div><div class="metric-row"><span>当前卡牌</span><b>${S.card?S.card[0]:'尚未读取'}</b></div><div class="metric-row"><span>模式</span><b>标准成长</b></div>${['启蒙期 0 / 5','成长期 0 / 5','青春期 0 / 5'].map(x=>`<div class="metric-row"><span>${x}</span><span class="hint">○○○○○</span></div>`).join('')}`;if(S.panel==='skills')body=`<h3>伍力技能</h3>${[['R','安全力','可用'],['A','脑波力','可用'],['S','实践力','冷却中'],['P','沟通力','可用'],['E','共情力','可用']].map(x=>`<div class="skill-row"><span><b>${x[0]}</b> ${x[1]}</span><span class="chip">${x[2]}</span></div>`).join('')}`;if(S.panel==='supervisor')body=`<h3>现场督导</h3><p class="hint">未开启</p><div class="summary" style="text-align:center;letter-spacing:.15em">▁▂▁▃▂▁▂▁</div><p class="hint">开启前会请求麦克风权限</p>${btn('开始现场录音','record','',false,'start-recording')}${btn('查看监督模式','top-watch','ghost',false,'open-supervision')}`;return `<aside class="side" data-od-id="game-side-rail">${[['status','01','本局游戏状态'],['skills','02','伍力技能'],['supervisor','03','现场督导']].map(x=>`<button class="accordion-btn" data-action="panel" data-value="${x[0]}" data-od-id="panel-${x[0]}"><span class="num">${x[1]}</span><span>${x[2]}</span><span class="chev">${S.panel===x[0]?'×':'⌄'}</span></button>`).join('')}${S.panel?`<div class="side-panel">${body}</div>`:''}<div class="side-actions">${btn(S.paused?'恢复游戏':'暂停游戏',S.paused?'resume':'pause','ghost',S.stopped,S.paused?'resume-game':'pause-game')}${btn('停止并复盘','stop','danger',S.stopped,'stop-game')}</div></aside>`}
  function cardView(){if(!S.card)return `<div class="empty" data-od-id="game-empty"><div><div class="empty-mark"></div><span class="kicker">DECISION DECK</span><h1>下一张情景牌<br>正在等你开启</h1><p class="hint">输入卡牌编号，或从可用牌库中快速选择。</p></div></div>`;return `<article class="scenario" data-od-id="scenario-card"><div class="card-meta"><b>${S.card[0]}</b><span class="chip">身体安全 · 启蒙期</span><span class="chip green">✓ 已读取</span></div><p class="kicker">先暂停，再看看发生了什么。</p><h1>屏幕之外的约定</h1><p>你坐在沙发上想看一会儿视频。一个接一个的视频自动播放。家人问你答应完成的事情做好了吗？你发现时间已经过去很久。</p><div class="choices">${[['A','继续看一会儿，反正只差一点'],['B','把屏幕藏起来，希望没人发现'],['C','先暂停，说明情况并重新安排时间']].map(x=>`<button class="choice ${S.choice===x[0]?'selected':''}" data-action="choice" data-value="${x[0]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>${S.feedback?`<section class="feedback" data-od-id="card-feedback"><div class="feedback-head"><div><span class="kicker">本桌卡牌反馈</span><h3>卡牌 B01 · 选择 ${S.choice}</h3></div><div class="delta"><span>安全力 +1</span><span>脑波力 −1</span></div></div><p>${S.choice==='C'?'暂停并说明情况，能帮助你重新拿回节奏，也让家人知道你正在负责地调整。':'这个选择可能让眼前更轻松，但会推迟处理问题的时机。试着先暂停，再诚实说明情况。'}</p><div class="feedback-actions">${btn('▷ 听反馈','listen','ghost',false,'listen-feedback')}${btn('完成本张 · 下一张 →','next-card','primary',false,'next-card')}</div></section>`:`<div class="feedback-actions"><span class="hint">选择一个做法后查看卡牌反馈</span>${btn('确认选择','submit-choice','primary',!S.choice,'submit-choice')}</div>`}</article>`}
  function picker(){const shown=cards.filter(c=>S.filter==='全部'||c[2]===S.filter);return `<div class="modal-backdrop"><section class="modal" data-od-id="quick-card-picker"><div class="modal-head"><div><h2>快速选择情景牌</h2><p class="hint">选择后将读取卡牌并进入游戏</p></div><button class="icon-btn" data-action="close-picker">×</button></div><div class="phase-tabs">${['启蒙期','成长期','青春期'].map(x=>`<button class="tab ${S.phase===x?'active':''}" data-action="phase" data-value="${x}">${x}</button>`).join('')}</div><div class="filterbar"><span class="hint">安全类型：</span>${['全部','安全力','脑波力','实践力','沟通力','共情力'].map(x=>`<button class="filter ${S.filter===x?'active':''}" data-action="filter" data-value="${x}">${x}</button>`).join('')}</div><div class="card-grid">${shown.map(c=>`<button class="card-tile ${S.pickerCard===c[0]?'selected':''}" data-action="picker-card" data-value="${c[0]}" data-od-id="picker-card-${c[0].toLowerCase()}"><b>${c[0]}</b>${c[1]}<span class="hint" style="display:block">${c[2]}</span></button>`).join('')}</div><div class="pager"><button class="btn ghost" disabled>上一页</button><span>第 1 / 1 页 · ${shown.length} 张</span><button class="btn ghost" disabled>下一页</button></div><div class="modal-actions">${btn('取消','close-picker','ghost')}${btn('确认读取','confirm-picker','primary',!S.pickerCard,'confirm-read')}</div></section></div>`}
  function game(){return `<main class="screen" data-od-id="game-screen">${header()}<div class="game-layout">${side()}<section class="main"><div class="reader-bar" data-od-id="card-reader"><div class="reader-wrap"><span class="search-icon">⌕</span><input class="field" data-field="cardCode" value="${esc(S.cardCode)}" placeholder="输入卡牌编号，如 B01" ${S.paused||S.stopped?'disabled':''}></div>${btn(S.card?'选择卡牌':'快速选卡','open-picker','',S.paused||S.stopped,'quick-card-picker-button')}</div><section class="canvas">${S.loading?`<div class="empty"><div><h1>正在读取卡牌…</h1><p class="hint">正在核对本局阶段与可用牌库</p></div></div>`:S.network?`<div class="empty"><div><h1>卡牌读取失败</h1><p class="error">网络连接中断，本次读取未记入本局。</p>${btn('重新读取','retry-read','primary')}</div></div>`:S.completed?`<div class="empty"><div><span class="chip green">本张已完成</span><h1>已记录你的选择</h1><p class="hint">伍力属性变化已同步到本局状态。</p>${btn('读取下一张','next-card','primary')}</div></div>`:cardView()}</section></section></div>${S.picker?picker():''}${S.confirm?`<div class="modal-backdrop"><section class="modal confirm"><h2>${S.confirm==='stop'?'停止游戏并进入复盘？':'暂停本局游戏？'}</h2><p>${S.confirm==='stop'?'当前进度将保存；停止后不能继续读卡，但可以查看本局复盘。':'暂停后计时和读卡都会锁定，可随时恢复。'}</p><div class="modal-actions">${btn('取消','cancel-confirm','ghost')}${btn(S.confirm==='stop'?'确认停止':'确认暂停','confirm-'+S.confirm,S.confirm==='stop'?'danger':'primary')}</div></section></div>`:''}</main>${dev()}`}
  function render(){q('#app').innerHTML=S.screen==='login'?login():S.screen==='activity'?activity():S.screen==='config'?config():game();bind()}
  function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action,el.dataset.value,el));document.querySelectorAll('[data-field]').forEach(el=>{el.oninput=()=>{const k=el.dataset.field;S[k]=k==='activityCode'?el.value.toUpperCase():el.value;if(k==='activityCode'){el.value=S[k];const b=q('[data-action="validate-code"]');if(b)b.disabled=!/^[A-Z]{5}$/.test(S.activityCode)}if(k==='phone'||k==='secret'){const b=q('[data-action="login"]');if(b)b.disabled=!(/^1\d{10}$/.test(S.phone)&&(S.loginMode==='password'?S.secret.length>=6:/^\d{6}$/.test(S.secret))&&S.agreed&&S.verified)}if(k==='cardCode'&&/^[A-Za-z]\d{2}$/.test(el.value)){S.cardCode=el.value.toUpperCase();readCard()}}})}
  function act(a,v,el){if(a==='dev')return set({dev:!S.dev});if(a==='login-password'||a==='login-code')return set({loginMode:a.endsWith('code')?'code':'password',secret:''});if(a==='agree'){S.agreed=el.checked;return render()}if(a==='verify')return set({verified:true});if(a==='login'){set({loading:true,network:false});return setTimeout(()=>set({screen:'activity',loading:false}),650)}if(a==='back-login')return set({screen:'login'});if(a==='validate-code'){set({codeState:'loading',activities:[],activity:null});return setTimeout(()=>S.activityCode==='WQTAY'?set({codeState:'ok',activities:[{name:'未来守望者 · 城市站',place:'上海 · 城市站'},{name:'数智安全体验营',place:'北京 · 国家会议中心'}]}):set({codeState:'error'}),600)}if(a==='pick-activity')return set({activity:+v});if(a==='activity-next')return set({screen:'config'});if(a==='config-back')return set({screen:'activity'});if(a==='mode'){const d={standard:[5,5,5],quick:[3,3,3],custom:[4,2,3]};return set({mode:v,counts:d[v]})}if(a==='step'){const [i,d]=v.split(',').map(Number),n=[...S.counts],max=S.mode==='custom'?[12,10,8][i]:15;n[i]=Math.max(0,Math.min(max,n[i]+d));return set({counts:n})}if(a==='start-game')return set({screen:'game'});if(a==='panel')return set({panel:S.panel===v?null:v});if(a==='pause'||a==='stop')return set({confirm:a});if(a==='cancel-confirm')return set({confirm:null});if(a==='confirm-pause')return set({paused:true,confirm:null});if(a==='resume')return set({paused:false});if(a==='confirm-stop')return set({stopped:true,paused:true,confirm:null,completed:true});if(a==='open-picker')return set({picker:true});if(a==='close-picker')return set({picker:false});if(a==='phase')return set({phase:v});if(a==='filter')return set({filter:v});if(a==='picker-card')return set({pickerCard:v});if(a==='confirm-picker'){S.cardCode=S.pickerCard;S.picker=false;return readCard()}if(a==='choice')return set({choice:v,feedback:false});if(a==='submit-choice')return set({feedback:true});if(a==='listen'){toast('正在播放卡牌反馈（演示音频）');return}if(a==='next-card')return set({card:null,cardCode:'',choice:null,feedback:false,completed:false});if(a==='retry-read')return readCard();if(a==='record'){toast('麦克风授权请求仅作演示');return}if(a==='top-watch'){toast('监督模式入口已响应');return}if(a==='top-me'){toast('“我的”入口已响应');return}if(a==='top-game'){toast('当前已在桌游模式');return}}
  function readCard(){set({loading:true,network:false,card:null,choice:null,feedback:false});setTimeout(()=>{if(S.cardCode==='NET')return set({loading:false,network:true});const c=cards.find(x=>x[0]===S.cardCode.toUpperCase());if(c)set({loading:false,card:c});else{set({loading:false,cardCode:''});toast('未找到该卡牌，请检查编号')}} ,550)}
  render();
  </script></body>
</html>
